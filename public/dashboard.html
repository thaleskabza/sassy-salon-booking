<!-- dashboard.html -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <title>Sassy Mellanin | Manager Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />

  <!-- SF Pro via system fonts -->
  <style>
    @supports (font: -apple-system-body) {
      :root { font: -apple-system-body; }
    }
  </style>

  <!-- Dashboard Styles -->
  <link href="dashboard.css" rel="stylesheet" />

  <!-- Chart.js and Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>

  <!-- Dashboard Logic as ES Module -->
  <script type="module" src="dashboard.js" defer></script>
</head>
<body>
  <!-- Navigation -->
  <nav class="nav-links">
    <a href="index.html" class="dashboard-link">Booking App</a>
  </nav>

  <div class="container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-content">
        <h1 class="app-title">Sassy Mellanin</h1>
        <p class="app-subtitle">Manager Dashboard</p>
      </div>
      <div class="header-actions">
        <button class="refresh-button" aria-label="Refresh data">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M23 4v6h-6"></path>
            <path d="M1 20v-6h6"></path>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"></path>
            <path d="M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- KPI Summary -->
    <section class="kpi-grid">
      <div class="kpi-card loading"><div class="skeleton-loader"></div></div>
      <div class="kpi-card loading"><div class="skeleton-loader"></div></div>
      <div class="kpi-card loading"><div class="skeleton-loader"></div></div>
      <div class="kpi-card loading"><div class="skeleton-loader"></div></div>
    </section>

    <!-- Time Range Selector -->
    <div class="segmented-control">
      <button class="segment" data-range="today">Today</button>
      <button class="segment" data-range="week">Week</button>
      <button class="segment active" data-range="month">Month</button>
      <button class="segment" data-range="custom">Custom</button>
    </div>

    <!-- Custom Date Inputs -->
    <div id="custom-date-inputs" class="custom-date-inputs hidden">
      <input type="date" id="custom-from" />
      <span>to</span>
      <input type="date" id="custom-to" />
      <button id="apply-custom-range" class="btn">Apply</button>
    </div>

    <!-- Main Dashboard -->
    <main class="dashboard-grid">
      <!-- Bookings by Service -->
      <section class="card">
        <div class="card-header">
          <h2>Bookings by Service</h2>
          <button class="card-action">View All</button>
        </div>
        <div class="chart-container loading">
          <canvas id="bookingsChart"></canvas>
          <div class="skeleton-loader"></div>
        </div>
        <div id="bookings-table" class="data-table"></div>
      </section>

      <!-- Revenue by Service -->
      <section class="card">
        <div class="card-header">
          <h2>Revenue by Service</h2>
          <button class="card-action">Export</button>
        </div>
        <div class="chart-container loading">
          <canvas id="revenueChart"></canvas>
          <div class="skeleton-loader"></div>
        </div>
        <div id="revenue-table" class="data-table"></div>
      </section>

      <!-- Top Clients -->
      <section class="card">
        <div class="card-header">
          <h2>Top Clients</h2>
          <button class="card-action">Manage</button>
        </div>
        <div class="chart-container loading">
          <canvas id="clientsChart"></canvas>
          <div class="skeleton-loader"></div>
        </div>
        <div id="clients-table" class="data-table"></div>
      </section>

      <!-- Daily Bookings -->
      <section class="card">
        <div class="card-header">
          <h2>Daily Bookings</h2>
          <button class="card-action">Timeline</button>
        </div>
        <div class="chart-container loading">
          <canvas id="dailyChart"></canvas>
          <div class="skeleton-loader"></div>
        </div>
        <div id="daily-table" class="data-table"></div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>© 2025 Sassy Mellanin. All rights reserved.</p>
      <div class="footer-links">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Support</a>
      </div>
    </footer>
  </div>
</body>
</html>
