<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sassy Mellanin | Managers Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- External CSS for styling -->
  <link href="dashboard.css" rel="stylesheet" />

  <!-- Chart.js for visualizations -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h1>📋 Sassy Mellanin — Managers Dashboard</h1>

  <!-- 📊 BOOKINGS BY SERVICE -->
  <div class="dashboard-section">
    <h2>📊 Bookings by Service</h2>
    <canvas id="bookingsChart"></canvas>
    <div id="bookings-table"></div>
  </div>

  <!-- 💰 REVENUE BY SERVICE -->
  <div class="dashboard-section">
    <h2>💰 Revenue by Service</h2>
    <canvas id="revenueChart"></canvas>
    <div id="revenue-table"></div>
  </div>

  <!-- 👑 TOP CLIENTS -->
  <div class="dashboard-section">
    <h2>👑 Top Clients</h2>
    <canvas id="clientsChart"></canvas>
    <div id="clients-table"></div>
  </div>

  <!-- 📅 DAILY BOOKING COUNTS -->
  <div class="dashboard-section">
    <h2>📅 Bookings per Day</h2>
    <canvas id="dailyChart"></canvas>
    <div id="daily-table"></div>
  </div>

  <footer>
    © 2025 Sassy Mellanin | Built by Codicis QA
  </footer>

  <!-- Custom Dashboard Logic -->
  <script src="dashboard.js" defer></script>
</body>
</html>
