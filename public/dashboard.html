<!-- public/dashboard.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sassy De'Beaute | Manager Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark">

  <!-- SF Pro via system fonts -->
  <style>
    @supports (font: -apple-system-body) {
      :root { font: -apple-system-body; }
    }
  </style>

  <!-- Internal Dashboard Styles -->
  <link href="dashboard.css" rel="stylesheet" />

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom"></script>
</head>
<body>
  <!-- 🌟 bookings Link (MOVED OUT OF <head>) -->
  <nav class="nav-links">
    <a href="index.html" class="dashboard-link">Booking app</a>
  </nav>

  <div class="container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-content">
        <h1 class="app-title">Sassy De'Beaute</h1>
        <p class="app-subtitle">Manager Dashboard</p>
      </div>
      <div class="header-actions">
        <button class="refresh-button" aria-label="Refresh data">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M23 4v6h-6M1 20v-6h6"></path>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- KPI Summary Cards -->
    <section class="kpi-grid">
      <div class="kpi-card loading"><div class="skeleton-loader"></div></div>
      <div class="kpi-card loading"><div class="skeleton-loader"></div></div>
      <div class="kpi-card loading"><div class="skeleton-loader"></div></div>
      <div class="kpi-card loading"><div class="skeleton-loader"></div></div>
    </section>

    <!-- Time Period Selector -->
    <div class="segmented-control">
      <button class="segment active" data-range="today">Today</button>
      <button class="segment" data-range="week">Week</button>
      <button class="segment" data-range="month">Month</button>
      <button class="segment" data-range="custom">Custom</button>
    </div>

    <!-- Dashboard Content -->
    <main class="dashboard-grid">
      <!-- Bookings by Service -->
      <section class="card">
        <div class="card-header">
          <h2>Bookings by Service</h2>
          <button class="card-action">View All</button>
        </div>
        <div class="chart-container loading">
          <canvas id="bookingsChart"></canvas>
          <div class="skeleton-loader"></div>
        </div>
        <div id="bookings-table" class="data-table"></div>
      </section>

      <!-- Revenue by Service -->
      <section class="card">
        <div class="card-header">
          <h2>Revenue by Service</h2>
          <button class="card-action">Export</button>
        </div>
        <div class="chart-container loading">
          <canvas id="revenueChart"></canvas>
          <div class="skeleton-loader"></div>
        </div>
        <div id="revenue-table" class="data-table"></div>
      </section>

      <!-- Top Clients -->
      <section class="card">
        <div class="card-header">
          <h2>Top Clients</h2>
          <button class="card-action">Manage</button>
        </div>
        <div class="chart-container loading">
          <canvas id="clientsChart"></canvas>
          <div class="skeleton-loader"></div>
        </div>
        <div id="clients-table" class="data-table"></div>
      </section>

      <!-- Daily Bookings -->
      <section class="card">
        <div class="card-header">
          <h2>Daily Bookings</h2>
          <button class="card-action">Timeline</button>
        </div>
        <div class="chart-container loading">
          <canvas id="dailyChart"></canvas>
          <div class="skeleton-loader"></div>
        </div>
        <div id="daily-table" class="data-table"></div>
      </section>

      <!-- NEW: Bookings per Employee -->
      <section class="card">
        <div class="card-header">
          <h2>Bookings per Employee</h2>
          <button class="card-action">Staff View</button>
        </div>
        <div class="chart-container loading">
          <canvas id="employeeBookingsChart"></canvas>
          <div class="skeleton-loader"></div>
        </div>
        <div id="employee-bookings-table" class="data-table"></div>
      </section>

      <!-- NEW: Commission per Employee -->
      <section class="card">
        <div class="card-header">
          <h2>Commission per Employee</h2>
          <button class="card-action">Export</button>
        </div>
        <div class="chart-container loading">
          <canvas id="employeeCommissionChart"></canvas>
          <div class="skeleton-loader"></div>
        </div>
        <div id="employee-commission-table" class="data-table"></div>
      </section>

      <!-- NEW: Executive Summary -->
      <section class="card executive-card">
        <div class="card-header">
          <h2>Executive Summary</h2>
          <button class="card-action" id="exec-refresh">Refresh</button>
        </div>
        <div id="executive-summary" class="executive-summary">
          <div class="skeleton-loader" style="height: 160px;"></div>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <p>© 2025 Sassy de'Beaute. All rights reserved.</p>
      <div class="footer-links">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Support</a>
      </div>
    </footer>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
