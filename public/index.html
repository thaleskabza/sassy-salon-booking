<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- FullCalendar UMD Global JS (defines window.FullCalendar) -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.4/index.global.min.js" defer></script>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap"
    rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.4/index.global.min.css" rel="stylesheet">
  <title>Sassy de'Beaute | Book Your Glow</title>


<body>
  <div class="container">
    <header class="salon-header">
      <div class="logo-container">
        <h1 class="salon-logo">Sassy De'Beaute</h1>
        <p class="salon-tagline">Where Beauty Meets Culture</p>
      </div>
      <div class="header-accent"></div>
    </header>

    <main class="booking-container">
      <section class="calendar-section">
        <h2 class="section-title">Book Your Glow Session</h2>
        <div id="calendar"></div>
      </section>

      <div id="booking-modal" class="modal hidden" aria-hidden="true">
        <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modal-title">
          <button id="close-modal" class="close-button" aria-label="Close modal">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>

          <div class="modal-header">
            <h2 id="modal-title">Secure Your Appointment</h2>
            <p class="modal-subtitle">Complete your booking details below</p>
          </div>

          <form id="booking-form">
            <div class="form-group">
              <label for="customer-name">Your Name</label>
              <input type="text" id="customer-name" required aria-required="true" placeholder="Enter your full name" />
            </div>

            <div class="form-group">
              <label for="customer-email">Email Address</label>
              <input type="email" id="customer-email" required aria-required="true" placeholder="your@email.com" />
            </div>

            <div class="form-group">
              <label for="customer-phone">Phone Number</label>
              <input type="tel" id="customer-phone" pattern="^0[6-8]\d{8}$" required aria-required="true"
                placeholder="0#########" />
            </div>

            <div class="form-group">
              <label for="service-select">Select Service</label>
              <div class="select-wrapper">
                <select id="service-select" required aria-required="true">
                  <option value="" disabled selected>Choose your treatment</option>
                </select>
                <div class="select-arrow"></div>
              </div>
            </div>

            <div class="form-group">
              <label for="appointment-datetime">Appointment Time</label>
              <input type="datetime-local" id="appointment-datetime" required aria-required="true" />
            </div>


            <div class="form-actions">
              <button type="submit" class="btn btn-primary">
                <span>Confirm Booking</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                  <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
              </button>
              <button type="button" class="btn btn-secondary" id="cancel-booking">Cancel</button>
            </div>
          </form>
        </div>
      </div>

      <div id="loading-indicator" class="loading hidden">
        <div class="spinner">
          <div class="spinner-circle"></div>
        </div>
        <p>Preparing your beauty experience...</p>
      </div>
    </main>

    <footer class="salon-footer">
      <p>© 2025 Sassy de'Beaute. All rights reserved.</p>
      <p>By Codicis QA</p>
      <div class="social-links">
        <a href="#" aria-label="Instagram"><span class="icon-instagram"></span></a>
        <a href="#" aria-label="Facebook"><span class="icon-facebook"></span></a>
        <a href="#" aria-label="Twitter"><span class="icon-twitter"></span></a>
      </div>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.4/index.global.min.js" defer></script>
  <script src="app.js" defer></script>
  <!-- dashboard.html -->


</body>

<footer>
    <!-- 🌟 Added Managers Dashboard Link -->
    <nav class="nav-links">
      <a href="dashboard.html" class="dashboard-link">Managers Dashboard</a>
    </nav>
  </head>
</footer>

</html>
